<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="description" content="Browse courses on ClassIQ.">
    <title>Courses | ClassIQ</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preload" href="../assets/fonts/poppins-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="min-h-screen bg-[#f7f7f7] font-['Poppins'] text-black antialiased courses-page">
    <header class="site-header course-header">
        <div class="course-header-brand">
            <a class="brand flex items-center" href="/" aria-label="ClassIQ home">
                <span class="brand-mark grid place-items-center rounded-lg bg-[#b8f56a]">
                    <svg aria-hidden="true" viewBox="0 0 32 32" fill="none">
                        <path d="M10 22.5 14 17l-2-4 5-4 3 2-3 5-5 1-2 5.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9.5" cy="23" r="2.3" fill="currentColor"/>
                        <circle cx="12" cy="12.5" r="2.3" fill="currentColor"/>
                        <circle cx="21" cy="10" r="2.3" fill="currentColor"/>
                        <circle cx="18" cy="16" r="2.3" fill="currentColor"/>
                        <path d="m22.5 6.5 2-2m-1 6 2-2m-7 11 2-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="course-brand-name">ClassIQ</span>
            </a>
            <a class="dashboard-link" href="/courses/" aria-current="page">Dashboard</a>
        </div>
        <nav class="course-account" aria-label="Account">
            <a class="nav-button action-button" href="/login/">Login</a>
            <a class="nav-button action-button" href="/signup/">SignUp</a>
        </nav>
    </header>

    <main class="course-page-shell">
        <section class="course-banner" aria-labelledby="courses-title">
            <h1 id="courses-title" class="course-banner-title">Enroll in Your Fav Courses</h1>
            <img class="course-banner-person" src="../assets/courses-learner.png" alt="" aria-hidden="true">
        </section>

        <section class="course-list-section" aria-labelledby="all-courses-title">
            <h2 id="all-courses-title" class="course-list-title">All Courses <img src="../assets/courses-arrow.png" alt="" aria-hidden="true"></h2>
            <div class="course-grid" aria-hidden="true">
                <div class="course-placeholder"></div>
                <div class="course-placeholder"></div>
                <div class="course-placeholder"></div>
                <div class="course-placeholder"></div>
                <div class="course-placeholder"></div>
                <div class="course-placeholder"></div>
            </div>
        </section>
    </main>
    <script type="module" src="animations.js"></script>
</body>
</html>
