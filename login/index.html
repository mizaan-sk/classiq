<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f7">
    <title>Login | ClassIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="min-h-screen bg-[#f7f7f7] font-['Poppins'] text-black antialiased">
    <header class="mx-auto flex w-full items-center justify-between px-5 pt-6 md:w-[82.6vw] md:px-0 md:pt-[4.45vw]">
        <div class="flex items-center max-md:mr-[2px] gap-2 md:gap-[0.95vw]">
            <a class="brand flex items-center gap-1.5 md:gap-[0.95vw]" href="/" aria-label="ClassIQ home">
                <span class="brand-mark grid place-items-center rounded-lg bg-[#b8f56a]">
                    <svg aria-hidden="true" viewBox="0 0 32 32" fill="none">
                        <path d="M10 22.5 14 17l-2-4 5-4 3 2-3 5-5 1-2 5.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9.5" cy="23" r="2.3" fill="currentColor"/>
                        <circle cx="12" cy="12.5" r="2.3" fill="currentColor"/>
                        <circle cx="21" cy="10" r="2.3" fill="currentColor"/>
                        <circle cx="18" cy="16" r="2.3" fill="currentColor"/>
                        <path d="m22.5 6.5 2-2m-1 6 2-2m-7 11 2-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="text-xl font-semibold tracking-tight md:text-[2.05vw]">ClassIQ</span>
            </a>
            <a class="text-[10px] text-[#4c4c4c] transition-colors hover:text-black md:ml-[3.7vw] md:text-[1.25vw]" href="#courses">Courses</a>
        </div>
        <nav class="flex items-center gap-3 md:gap-[2.1vw]" aria-label="Account">
            <a class="nav-button rounded-md bg-black px-4 py-2 text-sm font-medium text-white transition-transform hover:-translate-y-0.5 md:px-[1.85vw] md:py-[0.72vw] md:text-[1.25vw]" href="/login" aria-current="page">Login</a>
            <a class="nav-button rounded-md bg-black px-4 py-2 text-sm font-medium text-white transition-transform hover:-translate-y-0.5 md:px-[1.85vw] md:py-[0.72vw] md:text-[1.25vw]" href="/signup">SignUp</a>
        </nav>
    </header>

    <main class="mx-auto mt-12 flex justify-center px-5 pb-10 md:mt-[10.3vw] md:px-0">
        <section class="auth-card login-card w-full max-w-sm bg-[#ededf0] px-6 py-8 md:max-w-none" aria-labelledby="login-title">
            <h1 id="login-title" class="mb-6 text-center text-xl font-semibold md:text-[1.67vw]">Login</h1>
            <form id="auth-form" data-form-type="login" class="flex flex-col" novalidate>
                <label class="sr-only" for="email">Your email</label>
                <input class="form-field mb-3.5 h-10 rounded-lg border-2 border-black bg-transparent px-3 text-sm font-medium outline-none transition-shadow placeholder:text-black focus:ring-2 focus:ring-[#b8f56a] md:mb-[1.5vw] md:h-[3vw] md:rounded-[0.55vw] md:px-[1.1vw] md:text-[1.25vw] md:leading-none" id="email" name="email" type="email" placeholder="Enter Your Email" autocomplete="email" maxlength="254" required>

                <label class="sr-only" for="password">Your password</label>
                <input class="form-field h-10 rounded-lg border-2 border-black bg-transparent px-3 text-sm font-medium outline-none transition-shadow placeholder:text-black focus:ring-2 focus:ring-[#b8f56a] md:h-[3vw] md:rounded-[0.55vw] md:px-[1.1vw] md:text-[1.25vw] md:leading-none" id="password" name="password" type="password" placeholder="Enter Your Password" autocomplete="current-password" minlength="8" maxlength="128" required>

                <button class="signup-button mt-8 h-10 rounded-lg bg-[#b8f56a] text-sm font-semibold transition-colors hover:bg-[#a8e65a] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black md:mt-[3vw] md:h-[3vw] md:rounded-[0.55vw] md:text-[1.25vw]" type="submit">SignUp</button>
                <p id="form-message" class="mt-3 hidden text-center text-xs leading-relaxed" role="status" aria-live="polite"></p>
            </form>
            <p class="mt-12 text-center text-xs font-medium md:mt-[5vw] md:text-[1.25vw]">
                Don’t have an account?
                <a class="font-semibold transition-opacity hover:opacity-70" href="/signup">SignUp</a>
            </p>
        </section>
    </main>
    <script type="module" src="../script.js"></script>
</body>
</html>
