<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f7">
    <meta name="description" content="Create your ClassIQ account and start learning.">
    <title>Sign up | ClassIQ</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <meta name="robots" content="noindex, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ClassIQ">
    <meta property="og:title" content="Sign up | ClassIQ">
    <meta property="og:description" content="Create your ClassIQ account and start learning.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Sign up | ClassIQ">
    <meta name="twitter:description" content="Create your ClassIQ account and start learning.">
    <link rel="preload" href="../assets/fonts/poppins-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="min-h-screen bg-[#f7f7f7] font-['Poppins'] text-black antialiased">
    <header class="site-header mx-auto flex w-full items-center justify-between px-5 pt-6 md:w-[82.6vw] md:px-0 md:pt-[4.45vw]">
        <div class="flex items-center max-md:mr-[2px] gap-2 md:gap-[0.95vw]">
            <a class="brand flex items-center gap-1.5 md:gap-[0.95vw]" href="/" aria-label="ClassIQ home">
                <span class="brand-mark grid place-items-center rounded-lg bg-[#b8f56a]">
                    <svg aria-hidden="true" viewBox="0 0 32 32" fill="none">
                        <path d="M10 22.5 14 17l-2-4 5-4 3 2-3 5-5 1-2 5.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9.5" cy="23" r="2.3" fill="currentColor"/>
                        <circle cx="12" cy="12.5" r="2.3" fill="currentColor"/>
                        <circle cx="21" cy="10" r="2.3" fill="currentColor"/>
                        <circle cx="18" cy="16" r="2.3" fill="currentColor"/>
                        <path d="m22.5 6.5 2-2m-1 6 2-2m-7 11 2-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="text-xl font-semibold tracking-tight md:text-[clamp(1.25rem,2.05vw,2rem)]">ClassIQ</span>
            </a>
            <a class="text-[10px] text-[#4c4c4c] transition-colors hover:text-black md:ml-[3.7vw] md:text-[clamp(0.8rem,1.25vw,1rem)]" href="/courses/">Courses</a>
        </div>
        <nav class="flex items-center gap-3 md:gap-[2.1vw]" aria-label="Account">
            <a class="nav-button action-button rounded-md bg-black px-4 py-2 text-sm font-medium text-white transition-transform hover:-translate-y-0.5 md:px-[1.85vw] md:py-[0.72vw] md:text-[clamp(0.8rem,1.25vw,1rem)]" href="/login">Login</a>
            <a class="nav-button action-button rounded-md bg-black px-4 py-2 text-sm font-medium text-white transition-transform hover:-translate-y-0.5 md:px-[1.85vw] md:py-[0.72vw] md:text-[clamp(0.8rem,1.25vw,1rem)]" href="/signup" aria-current="page">SignUp</a>
        </nav>
    </header>

    <main class="auth-main mx-auto mt-0 flex items-center justify-center px-5 pb-10 md:mt-[10.3vw] md:items-stretch md:px-0">
        <section class="auth-card w-full max-w-sm bg-[#ededf0] px-6 py-8 md:max-w-none" aria-labelledby="signup-title">
            <h1 id="signup-title" class="mb-6 text-center text-xl font-semibold md:text-[clamp(1.125rem,1.67vw,1.5rem)]">SignUp</h1>
            <form id="auth-form" data-form-type="signup" class="flex flex-col" method="post" novalidate>
                <label class="sr-only" for="email">Your email</label>
                <input class="form-field h-10 rounded-lg border-2 border-black bg-transparent px-3 text-sm font-medium outline-none transition-shadow placeholder:text-black focus:ring-2 focus:ring-[#b8f56a] md:h-[clamp(2.75rem,3vw,3.25rem)] md:rounded-[0.55vw] md:px-[1.1vw] md:text-[clamp(0.9rem,1.25vw,1.125rem)] md:leading-none" id="email" name="email" type="email" placeholder="Enter Your Email" autocomplete="email" maxlength="254" aria-describedby="email-error" required>
                <p id="email-error" class="field-error" aria-live="polite"></p>

                <label class="sr-only" for="fullname">Your full name</label>
                <input class="form-field mt-3.5 h-10 rounded-lg border-2 border-black bg-transparent px-3 text-sm font-medium outline-none transition-shadow placeholder:text-black focus:ring-2 focus:ring-[#b8f56a] md:mt-[1.5vw] md:h-[clamp(2.75rem,3vw,3.25rem)] md:rounded-[0.55vw] md:px-[1.1vw] md:text-[clamp(0.9rem,1.25vw,1.125rem)] md:leading-none" id="fullname" name="fullname" type="text" placeholder="Enter Your Fullname" autocomplete="name" minlength="2" maxlength="100" aria-describedby="fullname-error" required>
                <p id="fullname-error" class="field-error" aria-live="polite"></p>

                <label class="sr-only" for="password">Your password</label>
                <input class="form-field mt-3.5 h-10 rounded-lg border-2 border-black bg-transparent px-3 text-sm font-medium outline-none transition-shadow placeholder:text-black focus:ring-2 focus:ring-[#b8f56a] md:mt-[1.5vw] md:h-[clamp(2.75rem,3vw,3.25rem)] md:rounded-[0.55vw] md:px-[1.1vw] md:text-[clamp(0.9rem,1.25vw,1.125rem)] md:leading-none" id="password" name="password" type="password" placeholder="Enter Your Password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-error" required>
                <p id="password-error" class="field-error" aria-live="polite"></p>

                <button class="action-button signup-button mt-6 h-10 rounded-lg bg-[#b8f56a] text-sm font-semibold transition-colors hover:bg-[#a8e65a] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black md:mt-[2.7vw] md:h-[3vw] md:rounded-[0.55vw] md:text-[clamp(0.9rem,1.25vw,1.125rem)]" type="submit">SignUp</button>
                <p id="form-message" class="mt-3 hidden text-center text-xs leading-relaxed" role="status" aria-live="polite"></p>
            </form>
            <p class="mt-12 text-center text-xs font-medium md:mt-[5vw] md:text-[clamp(0.8rem,1.25vw,1rem)]">
                Already have an account?
                <a class="font-semibold underline underline-offset-2 transition-opacity hover:opacity-70" href="/login">Login</a>
            </p>
        </section>
    </main>
    <script src="../auth-validation.js"></script>
    <script type="module" src="../script.js"></script>
</body>
</html>
